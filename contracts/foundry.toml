# contracts project: pin compiler behavior and isolate SMTChecker from normal Foundry tests.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "bridge-src/=src/"]
solc = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
deny = "warnings"
# OpenZeppelin 5.6.1 uses `error` as a local identifier; solc 0.8.36 only warns that it may become reserved.
ignored_error_codes = [6335]
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 100
fail_on_revert = true

[profile.smt]
optimizer = false
via_ir = false
deny = "warnings"

[profile.smt.model_checker]
engine = "chc"
solvers = ["z3"]
targets = ["assert"]
invariants = ["contract"]
show_unproved = true
timeout = 30000
