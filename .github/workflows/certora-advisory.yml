name: certora-advisory

on:
  push:
    branches:
      - main
    paths:
      - "contracts/src/**"
      - "contracts/lib/openzeppelin-contracts"
      - "verification/certora/**"
      - "scripts/check_certora_manifest.py"
      - "scripts/install-certora-solc.sh"
      - "scripts/run_certora_advisory.sh"
      - ".github/workflows/certora-advisory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certora-advisory-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [bridge, bsns, timelock]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install uv 0.8.4
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.8.4
          enable-cache: true
      - name: Install locked Certora client and Solidity compiler
        run: |
          uv sync --project verification/certora --frozen
          scripts/install-certora-solc.sh
      - name: Validate advisory evidence
        run: python3 scripts/check_certora_manifest.py
      - name: Compile and run private Certora verification
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: scripts/run_certora_advisory.sh cloud "${{ matrix.target }}"
      - name: Upload secret-free result summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certora-${{ matrix.target }}-${{ github.sha }}
          path: |
            verification/output/certora/${{ matrix.target }}.log
            verification/output/certora/${{ matrix.target }}-summary.json
          if-no-files-found: warn
          retention-days: 30
