name: trusted-pr-gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: trusted-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      matrix: ${{ steps.classify.outputs.matrix }}
      any: ${{ steps.classify.outputs.any }}
      policy: ${{ steps.classify.outputs.policy }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin current trusted base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch untrusted head as data
        env:
          HEAD_REF: refs/pull/${{ github.event.pull_request.number }}/head
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
      - name: Classify changed paths with trusted classifier
        id: classify
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
            python3 scripts/ci_changed_areas.py --null --github-output "$GITHUB_OUTPUT"
      - name: Install trusted classifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Validate trusted classifier
        run: |
          python3 scripts/test_ci_changed_areas.py
          python3 scripts/test_ci_modes.py
          python3 scripts/test_trusted_pr_gate.py

  test:
    needs: classify
    if: needs.classify.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.classify.outputs.matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.classify.outputs.base_sha }}
          path: trusted-policy
          persist-credentials: false
      - name: Install pinned Rust toolchain
        working-directory: trusted-policy
        run: rustup show
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install complete CI toolchain
        run: trusted-policy/scripts/install-ci-tools.sh all
      - name: Install trusted UI dependencies without lifecycle scripts
        run: pnpm --dir trusted-policy/ui install --frozen-lockfile --ignore-scripts
      - name: Install Chromium when required
        if: matrix.area == 'ui' || matrix.area == 'real'
        run: pnpm --dir trusted-policy/ui exec playwright install --with-deps chromium
      - name: Build the pinned isolation image from trusted policy
        run: docker build --file trusted-policy/.github/trusted-pr/Dockerfile --tag kinic-bridge-trusted-pr:local trusted-policy
      - name: Check out exact untrusted head as read-only container input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Run selected trusted check
        env:
          AREA: ${{ matrix.area }}
          BRIDGE_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_check() {
            trusted-policy/scripts/trusted-pr-container.sh source trusted-policy "$1"
          }
          case "$AREA" in
            rust)
              run_check rust-fast
              run_check rust-integration
              ;;
            contracts)
              run_check contracts-fast
              run_check contracts-coverage
              ;;
            proofs) run_check proofs ;;
            ui)
              run_check ui-fast
              run_check ui-e2e
              ;;
            real) run_check real ;;
            icp) run_check icp ;;
            *) exit 2 ;;
          esac

  policy-review:
    needs: classify
    if: needs.classify.outputs.policy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require current repository-owner approval for policy changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          approved="$({ gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" || exit 1; } |
            jq --arg head "$HEAD_SHA" -s -r '[add | sort_by(.submitted_at) | group_by(.user.login)[] | last |
              select(.state == "APPROVED" and .commit_id == $head) | .user.login] |
              any(. == "humandebri")')"
          test "$approved" = true

  trusted-pr-gate:
    if: always()
    needs: [classify, test, policy-review]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require trusted classification and applicable checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ANY: ${{ needs.classify.outputs.any }}
          POLICY: ${{ needs.classify.outputs.policy }}
          TEST_RESULT: ${{ needs.test.result }}
          POLICY_REVIEW_RESULT: ${{ needs.policy-review.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [[ "$ANY" == true ]]; then
            test "$TEST_RESULT" = success
          else
            test "$TEST_RESULT" = skipped
          fi
          if [[ "$POLICY" == true ]]; then
            test "$POLICY_REVIEW_RESULT" = success
          else
            test "$POLICY_REVIEW_RESULT" = skipped
          fi
