name: trusted-pr-gate

# Sensitive validation-boundary changes require one exact-head Environment review.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      matrix: ${{ steps.classify.outputs.matrix }}
      any: ${{ steps.classify.outputs.any }}
      review_required: ${{ steps.classify.outputs.review_required }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin current trusted base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch untrusted head as data
        env:
          HEAD_REF: refs/pull/${{ github.event.pull_request.number }}/head
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
      - name: Classify changed paths with trusted classifier
        id: classify
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
            python3 scripts/ci_changed_areas.py --null --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Require complete trusted classifier outputs
        env:
          CLASSIFY_ANY: ${{ steps.classify.outputs.any }}
          CLASSIFY_MATRIX: ${{ steps.classify.outputs.matrix }}
          REVIEW_REQUIRED: ${{ steps.classify.outputs.review_required }}
        run: |
          case "$CLASSIFY_ANY" in
            true|false) ;;
            *) echo "trusted classifier did not emit a boolean any output" >&2; exit 1 ;;
          esac
          case "$REVIEW_REQUIRED" in
            true|false) ;;
            *) echo "trusted classifier did not emit a boolean review_required output" >&2; exit 1 ;;
          esac
          test -n "$CLASSIFY_MATRIX"
      - name: Install trusted classifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Validate trusted classifier
        run: |
          python3 scripts/test_ci_changed_areas.py
          python3 scripts/test_ci_modes.py
          python3 scripts/test_trusted_pr_gate.py

  trusted-change-review:
    name: Review exact head ${{ github.event.pull_request.head.sha }}
    needs: classify
    if: needs.classify.outputs.review_required == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    environment:
      name: trusted-change-review
      url: https://github.com/${{ github.event.pull_request.head.repo.full_name }}/commit/${{ github.event.pull_request.head.sha }}
    steps:
      - name: Bind approval to the current PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "Approved trusted validation inputs for exact head $EXPECTED_HEAD_SHA"

  test:
    needs: [classify, trusted-change-review]
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.any == 'true' &&
      (
        (needs.classify.outputs.review_required == 'true' && needs.trusted-change-review.result == 'success') ||
        (needs.classify.outputs.review_required == 'false' && needs.trusted-change-review.result == 'skipped')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.classify.outputs.base_sha }}
          path: trusted-policy
          persist-credentials: false
      - name: Install pinned Rust toolchain
        working-directory: trusted-policy
        run: rustup show
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install uv 0.8.4
        if: contains(fromJSON(needs.classify.outputs.matrix), 'proofs')
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.8.4
          enable-cache: false
      - name: Restore cached proof toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: contains(fromJSON(needs.classify.outputs.matrix), 'proofs')
        with:
          path: |
            /home/runner/.elan
            /home/runner/.local/z3-5.0.0
            /home/runner/.local/verus
            /home/runner/.local/bin
            /home/runner/.rustup/toolchains/1.96.0
          key: bridge-trusted-pr-proof-tools-${{ hashFiles('trusted-policy/lean-toolchain', 'trusted-policy/scripts/install-ci-tools.sh') }}
      - name: Install CI toolchain
        env:
          AREAS: ${{ needs.classify.outputs.matrix }}
        run: |
          mode="ci"
          while IFS= read -r area; do
            case "$area" in
              proofs) mode="all"; break ;;
              *) mode="ci" ;;
            esac
          done < <(jq -r '.[]' <<< "$AREAS")
          trusted-policy/scripts/install-ci-tools.sh "$mode"
      - name: Save cached proof toolchain
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: contains(fromJSON(needs.classify.outputs.matrix), 'proofs')
        with:
          path: |
            /home/runner/.elan
            /home/runner/.local/z3-5.0.0
            /home/runner/.local/verus
            /home/runner/.local/bin
            /home/runner/.rustup/toolchains/1.96.0
          key: bridge-trusted-pr-proof-tools-${{ hashFiles('trusted-policy/lean-toolchain', 'trusted-policy/scripts/install-ci-tools.sh') }}
      - name: Prefetch locked Rust dependencies from trusted policy
        run: cargo fetch --locked --manifest-path trusted-policy/Cargo.toml
      - name: Prefetch pinned ICP recipes from trusted policy
        working-directory: trusted-policy
        env:
          ICP_CLI_DISABLE_UPDATE: "1"
          ICP_TELEMETRY_DISABLED: "1"
        run: icp project show --project-root-override . >/dev/null
      - name: Check out exact candidate head as reviewed data input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Isolate reviewed candidate dependency inputs
        run: |
          dependency_root="$RUNNER_TEMP/bridge-trusted-dependencies"
          python3 trusted-policy/scripts/prepare_candidate_dependencies.py \
            --source source --destination "$dependency_root"
          echo "BRIDGE_TRUSTED_DEPENDENCY_ROOT=$dependency_root" >> "$GITHUB_ENV"
      - name: Install reviewed workspace dependencies without lifecycle scripts
        run: pnpm --dir "$BRIDGE_TRUSTED_DEPENDENCY_ROOT" install --frozen-lockfile --ignore-scripts
      - name: Install reviewed UI dependencies without lifecycle scripts
        run: pnpm --dir "$BRIDGE_TRUSTED_DEPENDENCY_ROOT/ui" install --frozen-lockfile --ignore-scripts
      - name: Install Chromium when required
        if: contains(fromJSON(needs.classify.outputs.matrix), 'ui') || contains(fromJSON(needs.classify.outputs.matrix), 'real')
        run: pnpm --dir "$BRIDGE_TRUSTED_DEPENDENCY_ROOT/ui" exec playwright install --with-deps chromium
      - name: Prefetch verified real-E2E ledger artifacts
        if: contains(fromJSON(needs.classify.outputs.matrix), 'real')
        run: node trusted-policy/ui/scripts/download-ledger-artifacts.mjs
      - name: Prefetch PocketIC runtime for integration checks
        if: contains(fromJSON(needs.classify.outputs.matrix), 'rust') || contains(fromJSON(needs.classify.outputs.matrix), 'real')
        run: |
          node "$BRIDGE_TRUSTED_DEPENDENCY_ROOT/node_modules/@dfinity/pic/postinstall.mjs"
          node "$BRIDGE_TRUSTED_DEPENDENCY_ROOT/ui/node_modules/@dfinity/pic/postinstall.mjs"
      - name: Build the pinned isolation image from trusted policy
        run: docker build --file trusted-policy/.github/trusted-pr/Dockerfile --tag kinic-bridge-trusted-pr:local trusted-policy
      - name: Verify isolation mount boundaries
        run: trusted-policy/scripts/test_trusted_pr_container_mounts.sh kinic-bridge-trusted-pr:local
      - name: Run selected trusted check
        env:
          AREAS: ${{ needs.classify.outputs.matrix }}
          BRIDGE_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_check() {
            trusted-policy/scripts/trusted-pr-container.sh \
              source trusted-policy "$1" "$BRIDGE_TRUSTED_DEPENDENCY_ROOT"
          }
          while IFS= read -r area; do
            case "$area" in
              rust)
                run_check rust-fast
                run_check rust-integration
                ;;
              contracts)
                run_check contracts-fast
                run_check contracts-coverage
                ;;
              certora) run_check certora ;;
              proofs) run_check proofs ;;
              ui)
                run_check ui-fast
                run_check ui-e2e
                ;;
              real) run_check real ;;
              icp) run_check icp ;;
              *) exit 2 ;;
            esac
          done < <(jq -r '.[]' <<< "$AREAS")

  trusted-pr-gate:
    if: always()
    needs: [classify, trusted-change-review, test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require trusted classification and applicable checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ANY: ${{ needs.classify.outputs.any }}
          REVIEW_REQUIRED: ${{ needs.classify.outputs.review_required }}
          REVIEW_RESULT: ${{ needs.trusted-change-review.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          case "$REVIEW_REQUIRED" in
            true) test "$REVIEW_RESULT" = success ;;
            false) test "$REVIEW_RESULT" = skipped ;;
            *) echo "invalid trusted review classification" >&2; exit 1 ;;
          esac
          if [[ "$ANY" == true ]]; then
            test "$TEST_RESULT" = success
          else
            test "$TEST_RESULT" = skipped
          fi
