name: trusted-pr-gate

# This file is intentionally promoted to the default branch before dependent PRs.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: trusted-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      matrix: ${{ steps.classify.outputs.matrix }}
      any: ${{ steps.classify.outputs.any }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin current trusted base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch untrusted head as data
        env:
          HEAD_REF: refs/pull/${{ github.event.pull_request.number }}/head
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
      - name: Classify changed paths with trusted classifier
        id: classify
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
            python3 scripts/ci_changed_areas.py --null --github-output "$GITHUB_OUTPUT"
      - name: Require complete trusted classifier outputs
        env:
          CLASSIFY_ANY: ${{ steps.classify.outputs.any }}
          CLASSIFY_MATRIX: ${{ steps.classify.outputs.matrix }}
        run: |
          case "$CLASSIFY_ANY" in
            true|false) ;;
            *) echo "trusted classifier did not emit a boolean any output" >&2; exit 1 ;;
          esac
          test -n "$CLASSIFY_MATRIX"
      - name: Install trusted classifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Validate trusted classifier
        run: |
          python3 scripts/test_ci_changed_areas.py
          python3 scripts/test_ci_modes.py
          python3 scripts/test_trusted_pr_gate.py

  test:
    needs: classify
    if: needs.classify.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.classify.outputs.matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.classify.outputs.base_sha }}
          path: trusted-policy
          persist-credentials: false
      - name: Install pinned Rust toolchain
        working-directory: trusted-policy
        run: rustup show
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install uv 0.8.4
        if: matrix.area == 'proofs'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.8.4
          enable-cache: false
      - name: Restore cached proof toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.area == 'proofs'
        with:
          path: |
            /home/runner/.elan
            /home/runner/.local/z3
            /home/runner/.local/verus
            /home/runner/.local/bin
            /home/runner/.rustup/toolchains/1.96.0
          key: bridge-trusted-pr-proof-tools-${{ hashFiles('trusted-policy/lean-toolchain', 'trusted-policy/scripts/install-ci-tools.sh') }}
      - name: Install CI toolchain
        env:
          AREA: ${{ matrix.area }}
        run: |
          case "$AREA" in
            proofs) mode="all" ;;
            *) mode="ci" ;;
          esac
          trusted-policy/scripts/install-ci-tools.sh "$mode"
      - name: Save cached proof toolchain
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.area == 'proofs'
        with:
          path: |
            /home/runner/.elan
            /home/runner/.local/z3
            /home/runner/.local/verus
            /home/runner/.local/bin
            /home/runner/.rustup/toolchains/1.96.0
          key: bridge-trusted-pr-proof-tools-${{ hashFiles('trusted-policy/lean-toolchain', 'trusted-policy/scripts/install-ci-tools.sh') }}
      - name: Prefetch locked Rust dependencies from trusted policy
        run: cargo fetch --locked --manifest-path trusted-policy/Cargo.toml
      - name: Prefetch pinned ICP recipes from trusted policy
        working-directory: trusted-policy
        env:
          ICP_CLI_DISABLE_UPDATE: "1"
          ICP_TELEMETRY_DISABLED: "1"
        run: icp project show --project-root-override . >/dev/null
      - name: Install trusted workspace dependencies
        run: pnpm --dir trusted-policy install --frozen-lockfile
      - name: Install trusted UI dependencies without lifecycle scripts
        run: pnpm --dir trusted-policy/ui install --frozen-lockfile --ignore-scripts
      - name: Install Chromium when required
        if: matrix.area == 'ui' || matrix.area == 'real'
        run: pnpm --dir trusted-policy/ui exec playwright install --with-deps chromium
      - name: Prefetch verified real-E2E ledger artifacts
        if: matrix.area == 'real'
        run: node trusted-policy/ui/scripts/download-ledger-artifacts.mjs
      - name: Prefetch PocketIC runtime for real E2E
        if: matrix.area == 'real'
        run: node trusted-policy/ui/node_modules/@dfinity/pic/postinstall.mjs
      - name: Build the pinned isolation image from trusted policy
        run: docker build --file trusted-policy/.github/trusted-pr/Dockerfile --tag kinic-bridge-trusted-pr:local trusted-policy
      - name: Check out exact untrusted head as read-only container input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Run selected trusted check
        env:
          AREA: ${{ matrix.area }}
          BRIDGE_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_check() {
            trusted-policy/scripts/trusted-pr-container.sh source trusted-policy "$1"
          }
          case "$AREA" in
            rust)
              run_check rust-fast
              run_check rust-integration
              ;;
            contracts)
              run_check contracts-fast
              run_check contracts-coverage
              ;;
            proofs) run_check proofs ;;
            ui)
              run_check ui-fast
              run_check ui-e2e
              ;;
            real) run_check real ;;
            icp) run_check icp ;;
            *) exit 2 ;;
          esac

  trusted-pr-gate:
    if: always()
    needs: [classify, test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require trusted classification and applicable checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ANY: ${{ needs.classify.outputs.any }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [[ "$ANY" == true ]]; then
            test "$TEST_RESULT" = success
          else
            test "$TEST_RESULT" = skipped
          fi
