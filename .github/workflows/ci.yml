# GitHub Actions: complete main, nightly, and manually dispatched repository gate.
name: bridge-ci

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"
  BRIDGE_EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Verify OpenZeppelin revision
        run: test "$(git -C contracts/lib/openzeppelin-contracts rev-parse HEAD)" = "5fd1781b1454fd1ef8e722282f86f9293cacf256"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install uv 0.8.4
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.8.4
          enable-cache: true
      - name: Install complete CI toolchain
        run: scripts/install-ci-tools.sh all
      - name: Configure CI identity
        run: |
          icp identity new bridge-ci \
            --storage plaintext \
            --output-seed /tmp/bridge-ci-seed
          rm -f /tmp/bridge-ci-seed
          icp identity default bridge-ci
          test "$(icp identity principal)" != "2vxsx-fae"
      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install UI dependencies and Chromium
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui exec playwright install --with-deps chromium
      - name: Run complete repository gate
        run: scripts/ci-local.sh all
      - name: Verify smoke restored the ICP configuration
        run: git diff --exit-code -- icp.yaml
