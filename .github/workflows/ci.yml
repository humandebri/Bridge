# GitHub Actions: reproduce the complete Phase 0 tool, proof, build, and deploy gate on Linux.
name: phase-0-ci

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: phase-0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install ICP CLI 0.2.7
        env:
          ICP_CLI_DISABLE_UPDATE: "1"
          ICP_CLI_NO_MODIFY_PATH: "1"
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            -o /tmp/icp-cli-installer.sh \
            https://github.com/dfinity/icp-cli/releases/download/v0.2.7/icp-cli-installer.sh
          echo "7293491f12d988bf52a75777c5c49daff5bda96032984c28dc1ccc28118b263c  /tmp/icp-cli-installer.sh" \
            | sha256sum --check
          sh /tmp/icp-cli-installer.sh --quiet

      - name: Install Z3 4.15.4
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            -o /tmp/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3-4.15.4-x64-glibc-2.39.zip
          echo "a41b690e89c343931471506cdc6d957b6044a200fd2d240cc017432afdff7d3e  /tmp/z3.zip" \
            | sha256sum --check
          unzip -q /tmp/z3.zip -d "$HOME/.local/z3"
          mkdir -p "$HOME/.local/bin"
          ln -s "$(find "$HOME/.local/z3" -type f -path '*/bin/z3' -print -quit)" "$HOME/.local/bin/z3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Verus 0.2026.05.05
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            -o /tmp/verus.zip \
            https://github.com/verus-lang/verus/releases/download/release/0.2026.05.05.d03e906/verus-0.2026.05.05.d03e906-x86-linux.zip
          echo "09c0ef9f59995a9c0e26c2a47ef6a6fc437d67816aca1685d05b872519af426c  /tmp/verus.zip" \
            | sha256sum --check
          unzip -q /tmp/verus.zip -d "$HOME/.local/verus"
          mkdir -p "$HOME/.local/bin"
          ln -s "$(find "$HOME/.local/verus" -type f -name verus -print -quit)" "$HOME/.local/bin/verus"

      - name: Run Phase 0 gate
        run: scripts/ci-local.sh all

      - name: Verify smoke restored the ICP configuration
        run: git diff --exit-code -- icp.yaml
