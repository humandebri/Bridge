# GitHub Actions: path-aware PR checks and the complete main/nightly gate.
name: bridge-ci

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      contracts: ${{ steps.classify.outputs.contracts }}
      proofs: ${{ steps.classify.outputs.proofs }}
      ui: ${{ steps.classify.outputs.ui }}
      real: ${{ steps.classify.outputs.real }}
      icp: ${{ steps.classify.outputs.icp }}
      any: ${{ steps.classify.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | python3 scripts/ci_changed_areas.py --null

      - name: Validate CI configuration
        run: |
          bash -n scripts/ci-local.sh
          bash -n scripts/install-ci-tools.sh
          python3 scripts/test_ci_changed_areas.py
          python3 scripts/test_ci_modes.py

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Run Rust fast checks
        run: scripts/ci-local.sh rust-fast
      - name: Run Rust integration checks
        run: scripts/ci-local.sh rust-integration

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Run contract fast checks
        run: scripts/ci-local.sh contracts-fast
      - name: Run contract coverage
        run: scripts/ci-local.sh contracts-coverage

  proofs:
    needs: changes
    if: needs.changes.outputs.proofs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install proof and interface tools
        run: scripts/install-ci-tools.sh proof
      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Run proof checks
        run: scripts/ci-local.sh proofs

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install didc 0.5.4
        run: scripts/install-ci-tools.sh didc
      - name: Install Chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium
      - name: Run UI fast checks
        run: scripts/ci-local.sh ui-fast
      - name: Run UI browser checks
        run: scripts/ci-local.sh ui-e2e
      - name: Upload UI failure artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bridge-ui-playwright
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  real:
    needs: changes
    if: needs.changes.outputs.real == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install dependencies and Chromium
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui exec playwright install --with-deps chromium
      - name: Run real Anvil and PocketIC integration
        run: scripts/ci-local.sh real
      - name: Upload real integration failure artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bridge-ui-real-integration
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  icp:
    needs: changes
    if: needs.changes.outputs.icp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install ICP CLI 1.0.2
        run: scripts/install-ci-tools.sh icp
      - name: Build the canister with ICP CLI
        run: scripts/ci-local.sh icp

  pr-gate:
    if: false
    needs:
      - changes
      - rust
      - contracts
      - proofs
      - ui
      - real
      - icp
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$RESULTS")"
          if [[ -n "$failures" ]]; then
            echo "$failures" >&2
            exit 1
          fi

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Verify OpenZeppelin revision
        run: test "$(git -C contracts/lib/openzeppelin-contracts rev-parse HEAD)" = "5fd1781b1454fd1ef8e722282f86f9293cacf256"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install Node.js 24.14.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pnpm 11.0.8
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.0.8
          run_install: false
      - name: Install complete CI toolchain
        run: scripts/install-ci-tools.sh all
      - name: Configure CI identity
        run: |
          icp identity new bridge-ci \
            --storage plaintext \
            --output-seed /tmp/bridge-ci-seed
          rm -f /tmp/bridge-ci-seed
          icp identity default bridge-ci
          test "$(icp identity principal)" != "2vxsx-fae"
      - name: Install Foundry 1.7.1
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install UI dependencies and Chromium
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui exec playwright install --with-deps chromium
      - name: Run complete repository gate
        run: scripts/ci-local.sh all
      - name: Verify smoke restored the ICP configuration
        run: git diff --exit-code -- icp.yaml
