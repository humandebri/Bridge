overrides:
  # Security override until miniflare pins sharp 0.35.5 or newer.
  "miniflare>sharp": 0.35.5
  # Security override until @coinbase/cdp-sdk permits axios 1.20.0 or newer.
  axios: 1.20.0
  # Security override for GHSA-73wf-gq98-2v4g until upstream dependency trees require a fixed browserslist.
  browserslist: 4.28.7
  brace-expansion: 5.0.8
  postcss: 8.5.23
  # Security override until upstream source-map-js dependencies permit the fixed version.
  source-map-js: 1.2.2
  # Security override until miniflare permits undici 7.30.1 or newer.
  undici: 7.30.1
allowBuilds:
  "@dfinity/pic": true
  "@reown/appkit": false
  esbuild: true
  sharp: true
  workerd: true
patchedDependencies:
  "@dfinity/oisy-wallet-signer@6.0.0": patches/@dfinity__oisy-wallet-signer@6.0.0.patch
peerDependencyRules:
  allowedVersions:
    "@dfinity/oisy-wallet-signer>@dfinity/utils": 4.2.1
    "@dfinity/oisy-wallet-signer>@icp-sdk/canisters": 3.6.0
    "@dfinity/oisy-wallet-signer>@icp-sdk/core": 5.4.0
    typescript: 6.0.2
