# Repository root: build and deploy the empty Rust Bridge canister with a pinned ICP recipe.
canisters:
  - name: bridge-canister
    recipe:
      type: "@dfinity/rust@v3.3.0"
      configuration:
        package: bridge-canister
        candid: canister/bridge-canister/bridge.did
        shrink: true
  - name: bridge-sepolia
    recipe:
      type: "file://recipes/test-bridge-rust.hbs"
      configuration:
        candid: canister/bridge-canister/bridge.did
  - name: ledger-sepolia
    recipe:
      type: "file://recipes/pinned-gzip-wasm.hbs"
      configuration:
        path: ui/.e2e-cache/ic-icrc1-ledger.wasm.gz
        sha256: 354dd6ecfdc72b5409805b31dea22c9db11df6e14095a5a68924eb63535e6d8a
  - name: index-sepolia
    recipe:
      type: "file://recipes/pinned-gzip-wasm.hbs"
      configuration:
        path: ui/.e2e-cache/ic-icrc1-index-ng.wasm.gz
        sha256: dab6808d0dfc06e5e88336d0c3d3e45e5448c6e36c2a781f3e9e09bd450f528c
  - name: frontend-sepolia
    build:
      steps:
        - type: script
          commands:
            - node ui/scripts/build-sepolia-assets.mjs
        - type: pre-built
          url: https://github.com/dfinity/sdk/raw/refs/tags/0.27.0/src/distributed/assetstorage.wasm.gz
          sha256: 865eb25df5a6d857147e078bb33c727797957247f7af2635846d65c5397b36a6
    sync:
      steps:
        - type: plugin
          url: https://github.com/dfinity/certified-assets/releases/download/migration-v2.2.1-6b48585/sync_plugin.wasm
          sha256: ca7cb5666c30d2875f8d5e10535f8a53f97a86c79c263f7d5bdac2fdd1bbf83c
          dirs:
            - ui/dist
networks:
  - name: local
    mode: managed
    version: v15.0.0-2026-07-02-07-40
    gateway:
      port: 8000

environments:
  - name: local
    network: local
    canisters:
      - bridge-canister
  - name: production
    network: ic
    canisters:
      - bridge-canister
  - name: sepolia-local
    network: local
    canisters:
      - bridge-sepolia
      - ledger-sepolia
      - index-sepolia
      - frontend-sepolia
  - name: sepolia-staging
    network: ic
    canisters:
      - bridge-sepolia
      - ledger-sepolia
      - index-sepolia
      - frontend-sepolia
