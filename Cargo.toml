# Repository root: group the pure Bridge core and the IC canister adapter in one workspace.
[workspace]
members = [
    "canister/bridge-core",
    "canister/bridge-canister",
    "canister/mock-external",
    "tools/bridge-profile",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97.0"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
candid = "=0.10.32"
ciborium = "=0.2.2"
ic-cdk = "=0.20.2"
ic-cdk-timers = "=1.0.0"
ic-sqlite-vfs = { version = "=2.0.0", default-features = false }
icrc-ledger-types = "=0.2.0"
evm_rpc_client = "=0.4.0"
evm_rpc_types = "=3.1.1"
ic-canister-runtime = "=0.2.3"
ic-cdk-management-canister = "=0.1.1"
ic-agent = "=0.47.3"
k256 = { version = "=0.13.4", default-features = false, features = ["alloc", "ecdsa"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread"] }
